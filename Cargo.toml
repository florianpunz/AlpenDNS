[workspace]
resolver = "3"
members = ["crates/alpendns"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://github.com/florianpunz/alpendns"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# Panics in a network daemon are availability bugs. Make them visible.
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
indexing_slicing = "deny"
integer_division = "warn"
todo = "warn"

# Versionen werden einmal hier deklariert. Wenn der Code später in eigene Crates
# wandert (alpendns-server, alpendns-cache, …), erben die sie über `workspace = true`
# und es gibt keine divergierenden Versionen im Baum.
[workspace.dependencies]
# ADR-0002: DNS-Wire-Format kommt aus hickory-proto, wir parsen nicht selbst.
hickory-proto = "0.26"
# Transporte für DoT/DoH/DoQ. Seit 0.26 ein eigenes Crate, getrennt vom
# Resolver — wir wollen die Verbindung, nicht dessen Cache und Policy.
# Nur die -ring-Varianten: aws-lc-rs führt die OpenSSL-Lizenz mit, die nicht in
# der Allowlist von deny.toml steht.
hickory-net = { version = "0.26", features = ["tls-ring", "https-ring", "quic-ring", "webpki-roots"] }
# ClientConfig-Typ für die TLS-Konfiguration. default-features aus, weil rustls
# sonst aws-lc-rs als Krypto-Backend zieht.
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
# StreamExt, um die erste Antwort aus dem Antwortstrom zu nehmen.
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "macros", "signal", "time", "io-util", "sync", "fs"] }
# CancellationToken + TaskTracker für Graceful Shutdown (Phase 1, Schritt 8).
# Selbstgebaut ist das genau die Sorte Nebenläufigkeitscode, die man falsch macht.
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
# Config schreibt Zeitangaben als "3s"/"24h" (siehe config/alpendns.example.toml).
humantime-serde = "1.1"
# Zufällige Query-IDs zum Upstream. Die ID des Clients ist von außen wählbar und
# darf nicht nach draußen durchgereicht werden.
rand = "0.10"
# LRU-Verdrängung im Cache. Eine intrusive Liste von Hand ist genau die Sorte
# Code, bei der Off-by-one-Fehler wochenlang unentdeckt bleiben.
lru = "0.18"
# Atomarer Tausch der Blocklisten ohne Lock im Anfragepfad (ARCHITECTURE.md §3).
arc-swap = "1.7"
# Blocklisten herunterladen. default-features aus: kein native-tls (OpenSSL),
# kein System-Proxy — der Prozess soll genau die konfigurierten Ziele
# kontaktieren und sonst nichts (B.1 Regel 4). rustls-tls-webpki-roots zieht
# ring als Krypto-Backend, nicht aws-lc-rs.
# `rustls-no-provider` statt `rustls`: letzteres zieht aws-lc-rs, das die
# OpenSSL-Lizenz mitführt. Das Krypto-Backend (ring) wird beim Start als
# Prozess-Default installiert, siehe filter::source::install_crypto_provider.
reqwest = { version = "0.13", default-features = false, features = [
    "rustls-no-provider",
    "webpki-roots",
    "http2",
    "gzip",
] }
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Property-Tests, siehe docs/TESTING.md §2.
proptest = "1.11"
# Nur für Tests: selbstsignierte Zertifikate für die DoT/DoH/DoQ-Fakes. Ohne
# eigenes Zertifikat gäbe es keinen Weg, die verschlüsselten Transporte zu
# prüfen, ohne echte Resolver zu kontaktieren.
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
h2 = "0.4"
http = "1"
bytes = "1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
