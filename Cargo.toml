[workspace]
resolver = "3"
members = ["crates/alpendns"]

[workspace.package]
version = "0.13.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://github.com/florianpunz/alpendns"
# Zeigt auf die Demo, nicht auf das Repo: die ist für jemanden, der das Projekt
# noch nicht kennt, die nützlichere Antwort auf "was ist das?". Sie wird von
# .github/workflows/pages.yml aus web/ gebaut.
homepage = "https://florianpunz.github.io/alpendns/"
authors = ["Florian Punz <florian.punz04@gmail.com>"]
keywords = ["dns", "privacy", "resolver", "dns-over-tls", "blocklist"]
categories = ["network-programming", "command-line-utilities"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# Panics in a network daemon are availability bugs. Make them visible.
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
indexing_slicing = "deny"
integer_division = "warn"
todo = "warn"

# Versionen werden einmal hier deklariert. Wenn der Code später in eigene Crates
# wandert (alpendns-server, alpendns-cache, …), erben die sie über `workspace = true`
# und es gibt keine divergierenden Versionen im Baum.
[workspace.dependencies]
# ADR-0002: DNS-Wire-Format kommt aus hickory-proto, wir parsen nicht selbst.
# dnssec-ring: eigene Validierung statt dem AD-Bit des Upstreams zu glauben
# (Phase 7, Schritt 3). Zieht `time` in den Produktionsbaum — Bewertung und
# Auflagen in docs/adr/0016-dnssec-validierung-im-forwarder.md und in der
# Ausnahme zu RUSTSEC-2026-0009 in deny.toml.
hickory-proto = { version = "0.26", features = ["dnssec-ring"] }
# Transporte für DoT/DoH/DoQ. Seit 0.26 ein eigenes Crate, getrennt vom
# Resolver — wir wollen die Verbindung, nicht dessen Cache und Policy.
# Nur die -ring-Varianten: aws-lc-rs führt die OpenSSL-Lizenz mit, die nicht in
# der Allowlist von deny.toml steht.
hickory-net = { version = "0.26", features = ["tls-ring", "https-ring", "quic-ring", "webpki-roots", "dnssec-ring"] }
# ClientConfig-Typ für die TLS-Konfiguration. default-features aus, weil rustls
# sonst aws-lc-rs als Krypto-Backend zieht.
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
# StreamExt, um die erste Antwort aus dem Antwortstrom zu nehmen.
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "macros", "signal", "time", "io-util", "sync", "fs"] }
# CancellationToken + TaskTracker für Graceful Shutdown (Phase 1, Schritt 8).
# Selbstgebaut ist das genau die Sorte Nebenläufigkeitscode, die man falsch macht.
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
# Config schreibt Zeitangaben als "3s"/"24h" (siehe config/alpendns.example.toml).
humantime-serde = "1.1"
# Zufällige Query-IDs zum Upstream. Die ID des Clients ist von außen wählbar und
# darf nicht nach draußen durchgereicht werden.
rand = "0.10"
# LRU-Verdrängung im Cache. Eine intrusive Liste von Hand ist genau die Sorte
# Code, bei der Off-by-one-Fehler wochenlang unentdeckt bleiben.
lru = "0.18"
# Atomarer Tausch der Blocklisten ohne Lock im Anfragepfad (ARCHITECTURE.md §3).
arc-swap = "1.7"
# Client-Identifikation über Subnetze. Liegt ohnehin schon im Baum (hickory).
ipnet = "2.12"
# Punycode auflösen, um IDN-Homographen zu erkennen (Phase 8, Schritt 5): ein
# kyrillisches 'а' in sparkasse.at erreicht uns als xn--sprkasse-..., und in
# der Form sieht es dem Original nicht ähnlich. Liegt ohnehin schon im Baum
# (über url/hickory-proto), hier nur als direkte Abhängigkeit benannt.
idna = "1.1"
# Public Suffix List für split_by_zone: ohne sie ist die registrierbare Domain
# von `shop.example.co.uk` das wirkungslose `co.uk`, und alle .co.uk-Namen
# landen beim selben Upstream. Die Liste ist einkompiliert — kein Netzabruf,
# keine Laufzeitdatei, keine zweite Sorte Zustand (B.1 Regel 4).
psl = "2.1"
# Ortszeit mit korrekter Sommerzeit für Zeitpläne. Bewusst *nicht* `time`:
# das steckt derzeit nur als dev-dependency im Baum, und genau darauf beruht die
# Advisory-Ausnahme für RUSTSEC-2026-0009 in deny.toml. Als Produktionsabhängigkeit
# wäre diese Begründung hinfällig.
jiff = "0.2"
# Regex-Regeln pro Policy. Die Engine ist endlich-automatenbasiert und kennt kein
# Backtracking — katastrophale Laufzeiten sind damit ausgeschlossen, nicht nur
# unwahrscheinlich.
regex = "1"
# HTTP-API und Web-UI. Die Roadmap nennt axum ausdrücklich.
axum = "0.8"
# Für die API-Antworten und das Query-Log im Modus `full`.
serde_json = "1"
# Erzeugt den Strom für Server-Sent Events. Von Hand wäre das ein
# Stream-Impl mit Zustandsmaschine für eine Schleife.
async-stream = "0.3"
# Blocklisten herunterladen. default-features aus: kein native-tls (OpenSSL),
# kein System-Proxy — der Prozess soll genau die konfigurierten Ziele
# kontaktieren und sonst nichts (B.1 Regel 4). rustls-tls-webpki-roots zieht
# ring als Krypto-Backend, nicht aws-lc-rs.
# `rustls-no-provider` statt `rustls`: letzteres zieht aws-lc-rs, das die
# OpenSSL-Lizenz mitführt. Das Krypto-Backend (ring) wird beim Start als
# Prozess-Default installiert, siehe filter::source::install_crypto_provider.
reqwest = { version = "0.13", default-features = false, features = [
    "rustls-no-provider",
    "webpki-roots",
    "http2",
    "gzip",
] }
# Oblivious DoH (RFC 9230, Phase 7 Schritt 4). Cloudflares Referenz-
# implementierung: Wire-Format der ODoH-Nachrichten, Config-Parsing und das
# HPKE darunter. Selbst geschriebenes Krypto-Framing wäre genau die Stelle, an
# der ein Fehler den ganzen Schutz still aufhebt (ADR-0017). Baut keine eigenen
# Verbindungen auf — das HTTP darüber machen wir mit reqwest.
odoh-rs = "1.0"
# Nur wegen der RNG-Traits: odoh-rs führt `hpke::rand_core::RngCore` in seiner
# Signatur, und ohne diese Zeile lässt sich unser Zufall nicht übergeben.
hpke = { version = "0.13", default-features = false }
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Property-Tests, siehe docs/TESTING.md §2.
proptest = "1.11"
# Nur für Tests: selbstsignierte Zertifikate für die DoT/DoH/DoQ-Fakes. Ohne
# eigenes Zertifikat gäbe es keinen Weg, die verschlüsselten Transporte zu
# prüfen, ohne echte Resolver zu kontaktieren.
rcgen = "0.14"
# Nur für Tests: OffsetDateTime, um die Gültigkeitsspanne einer selbst
# erzeugten RRSIG zu setzen (tests/dnssec.rs). Seit hickorys dnssec-Feature
# liegt time ohnehin im Produktionsbaum, siehe deny.toml.
time = { version = "0.3", default-features = false, features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
h2 = "0.4"
http = "1"
bytes = "1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
