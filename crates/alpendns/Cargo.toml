[package]
name = "alpendns"
description = "Privacy-focused DNS server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
# Ohne diese Zeile hätte eine crates.io-Seite keinen Beschreibungstext: die
# README liegt im Wurzelverzeichnis, nicht im Paket.
readme = "../../README.md"

[lints]
workspace = true

[dependencies]
arc-swap.workspace = true
bytes.workspace = true
async-stream.workspace = true
axum.workspace = true
futures-util.workspace = true
hickory-net.workspace = true
ipnet.workspace = true
jiff.workspace = true
hickory-proto.workspace = true
hpke.workspace = true
idna.workspace = true
odoh-rs.workspace = true
tokio.workspace = true
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
humantime-serde.workspace = true
lru.workspace = true
psl.workspace = true
rand.workspace = true
regex.workspace = true
reqwest.workspace = true
rustls.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
h2.workspace = true
http.workspace = true
proptest.workspace = true
# Nur für Tests: das json-Feature. Als dev-dependency wirkt es nicht auf den
# Produktionsbau, der reqwest nur zum Herunterladen von Listen braucht.
reqwest = { workspace = true, features = ["json"] }
quinn.workspace = true
rcgen.workspace = true
tokio = { workspace = true, features = ["test-util", "process"] }
tokio-rustls.workspace = true
time.workspace = true

# ---------------------------------------------------------------------------
# Debian-Paket (ROADMAP Phase 9, Schritt 4)
# ---------------------------------------------------------------------------
#
# Bauen:  cargo deb -p alpendns
# Ergebnis: target/debian/alpendns_<version>_<arch>.deb
#
# cargo-deb ist ein Werkzeug, keine Abhängigkeit des Bauens: `cargo build`
# funktioniert weiterhin ohne es. Installiert wird es mit
#   cargo install cargo-deb --locked
[package.metadata.deb]
maintainer = "Florian Punz <florian.punz04@gmail.com>"
copyright = "2026, Florian Punz"
extended-description = """\
AlpenDNS ist ein forwarding DNS-Resolver für das eigene Netz. Er filtert gegen \
Blocklisten und Policies und leitet ausschließlich verschlüsselt weiter \
(DoT/DoH/DoQ). Query-Namen werden per Default nicht gespeichert; fünf lokale \
Heuristiken melden Auffälligkeiten, ohne zu blocken."""
section = "net"
priority = "optional"
# Die Unit läuft den Dienst als eigenen User; adduser kommt aus dem Basissystem
# und steht hier nur, damit ein minimales Image nicht daran scheitert.
depends = "$auto, adduser, systemd"
assets = [
    ["target/release/alpendns", "usr/bin/", "755"],
    ["../../packaging/alpendns.toml", "etc/alpendns/alpendns.toml", "644"],
    ["../../docs/OPERATIONS.md", "usr/share/doc/alpendns/OPERATIONS.md", "644"],
    ["../../config/alpendns.example.toml", "usr/share/doc/alpendns/alpendns.example.toml", "644"],
    ["../../README.md", "usr/share/doc/alpendns/README.md", "644"],
]
# Ausdrücklich, obwohl cargo-deb alles unter /etc ohnehin so behandelt: ein
# Upgrade darf eine bearbeitete Konfiguration nicht überschreiben.
conf-files = ["/etc/alpendns/alpendns.toml"]
maintainer-scripts = "../../packaging/debian"

[package.metadata.deb.systemd-units]
unit-name = "alpendns"
unit-scripts = "../../packaging/systemd"
enable = true
# Gestartet wird im postinst von Hand: schlägt der erste Start fehl (kein Netz,
# Port 53 belegt), soll das eine erklärte Meldung geben und nicht ein halb
# konfiguriertes Paket.
start = false
restart-after-upgrade = true
