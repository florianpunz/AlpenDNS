# AlpenDNS — shipping configuration of the Debian package.
#
# It is deliberately restrained: after `apt install` a working resolver runs
# that is **reachable from this machine only**. Whoever wants to use it in the
# LAN changes exactly one block — the first one. That is the only change normal
# operation needs.
#
# The full reference of all keys sits next to it:
#   /usr/share/doc/alpendns/alpendns.example.toml
# Operation, upgrade, troubleshooting:
#   /usr/share/doc/alpendns/OPERATIONS.md
#
# After every change, before the restart:
#   sudo alpendns -c /etc/alpendns/alpendns.toml check
#
# Unknown keys are a startup error, not a warning. A typo must not lead to
# someone sitting unfiltered on the internet and not noticing.

[server]
# ---------------------------------------------------------------------------
# CHANGE HERE to make the resolver usable in the LAN.
#
# What ships is loopback: freshly installed, the server is not reachable from
# outside. A resolver listening to the internet unasked is an amplification
# reflector, and that must not be the state it ships in.
#
# For your own network enter the LAN address of this machine, for example:
#   listen_udp = ["127.0.0.1:53", "192.168.1.10:53"]
#   listen_tcp = ["127.0.0.1:53", "192.168.1.10:53"]
#
# A concrete address and not "0.0.0.0": the wildcard also binds to an interface
# that may be facing the internet tomorrow.
# ---------------------------------------------------------------------------
listen_udp = ["127.0.0.1:53", "[::1]:53"]
listen_tcp = ["127.0.0.1:53", "[::1]:53"]
query_timeout = "3s"

[server.edns]
udp_payload_size = 1232

# Rate limiting per client. On, on loopback as well — otherwise, when switching
# to a LAN address, exactly the setting that is needed there would fall away.
# 100 queries per second are a lot for one device and very little for one
# attacker; the burst catches page loads with many embeds.
[server.rate_limit]
enabled = true
per_client_qps = 100
burst = 200
max_clients = 8192

# ---------------------------------------------------------------------------
# Upstreams — encrypted, several providers
# ---------------------------------------------------------------------------
#
# split_by_zone spreads the domains over the resolvers via a random seed: the
# same name always goes to the same provider (the cache stays effective), but no
# one sees the whole profile. The seed is drawn anew daily.
#
# Cleartext (udp://) is not allowed here and is a startup error.

[[upstream_pool]]
name = "default"
strategy = "split_by_zone"
seed_rotation = "24h"

[[upstream_pool.resolver]]
name = "quad9"
addr = "dot://9.9.9.9:853"
tls_name = "dns.quad9.net"

[[upstream_pool.resolver]]
name = "mullvad"
addr = "doh://194.242.2.4/dns-query"
tls_name = "dns.mullvad.net"

[[upstream_pool.resolver]]
name = "dnsforge"
addr = "doh://176.9.93.198/dns-query"
tls_name = "dnsforge.de"

# Internal zones to the router in your own network. The only place where
# cleartext DNS is allowed — and the query does not leave the LAN doing so.
# [[forward_zone]]
# zone = "home.arpa"
# upstream = "udp://192.168.1.1:53"

# Entries of your own that AlpenDNS answers itself — for names that do not exist
# in DNS (nas.meinedomain.at, drucker.meinedomain.at). A table, not a zone file:
# no SOA, no AXFR, AlpenDNS does not become authoritative for it. The difference
# to forward_zone above: there another nameserver is asked, here an answer is
# given. Both at the same time for the same zone is a startup error. Shape and
# all details: alpendns.example.toml.
# [[local_zone]]
# zone = "meinedomain.at"
# fallback = "upstream"          # "nxdomain" closes the zone entirely
# records = [
#   { name = "@",   type = "A", value = "192.168.1.5" },
#   { name = "nas", type = "A", value = "192.168.1.5" },
# ]

[cache]
max_entries = 100_000
min_ttl = "10s"
max_ttl = "24h"
max_negative_ttl = "15m"
serve_stale = true
serve_stale_max = "1h"
prefetch = true
prefetch_threshold = 0.85

[privacy]
strip_ecs = true
padding = true
cookies = true
dns0x20 = true

[privacy.logging]
# aggregate: counters and frequencies, but no name below the k threshold and no
# line on disk. That is the default and the restraint this project exists for.
#
# For the observation week (docs/ROADMAP.md, phase 8 acceptance) the UI needs
# names; `ring` is meant for that — the last minutes in RAM, never on disk:
#   mode = "ring"
mode = "aggregate"
ring_seconds = "5m"
aggregate_k = 5

# ---------------------------------------------------------------------------
# Blocking
# ---------------------------------------------------------------------------

[blocking]
mode = "nxdomain"
# Created by systemd (CacheDirectory=), owned by the service user. That way a
# restart filters even without internet.
cache_dir = "/var/cache/alpendns/lists"

# ATTENTION: Without a reachable list the *first* start aborts — better no DNS
# than unfiltered DNS. A later outage is not critical, the cached version then
# stays in force.
[[blocklist]]
name = "stevenblack-unified"
url = "https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts"
format = "hosts"
refresh = "24h"
enabled = true

# ---------------------------------------------------------------------------
# Heuristics — all on `flag`, none of them blocks
# ---------------------------------------------------------------------------
#
# `flag` means: it runs, it counts along, it shows up in the UI under "Flagged"
# — and it blocks nothing. The way to `block` goes through a week of
# observation and a review of the false positives; the instructions for that are
# in OPERATIONS.md under "Observation week".

[detection]
dga = { action = "flag", threshold = 0.75 }
tunneling = { action = "flag", threshold = 0.75, window = "5m", allow_zones = [] }
rebinding = { action = "flag", allow_zones = [] }
# Without entries the typosquat guard does nothing. This is where the domains
# that matter to YOU belong — bank, government agency, employer:
#   typosquat = { action = "flag", threshold = 0.85, protect = ["meine-bank.at"] }
typosquat = { action = "flag", threshold = 0.85, protect = [] }
# If the file is missing, the detector runs empty. The resolver does not depend
# on a second service having run.
nrd = { action = "flag", max_age = "30d", source = "/var/lib/alpendns/nrd.txt" }

# ---------------------------------------------------------------------------
# API, UI, metrics
# ---------------------------------------------------------------------------

# The UI shows names and therefore belongs on loopback. From another machine it
# is reached through an SSH tunnel:
#   ssh -L 8053:127.0.0.1:8053 <server>
# and then http://127.0.0.1:8053 in the browser.
[api]
enabled = true
listen = "127.0.0.1:8053"
# Under /var/lib and not under /etc: the unit sets ProtectSystem=strict, /etc is
# read-only for the service. The token is created on the first start and stored
# with mode 0600.
token_file = "/var/lib/alpendns/api.token"

# Without a token, but also without names in the output. Off until someone has a
# Prometheus to pick it up.
[metrics]
enabled = false
listen = "127.0.0.1:9153"
path = "/metrics"
