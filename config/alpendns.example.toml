# AlpenDNS — example configuration
#
# This file is the TARGET configuration, not the state of the implementation.
# It serves as a specification: every phase in docs/ROADMAP.md activates part of it.
# Sections that are not implemented yet are marked [PHASE n].
#
# Convention: the server only starts when the configuration can be parsed
# completely. Unknown keys are an error, not a warning (see CLAUDE.md).

[server]
# Listeners for unencrypted DNS in the LAN.
listen_udp = ["0.0.0.0:53", "[::]:53"]
listen_tcp = ["0.0.0.0:53", "[::]:53"]
# Maximum queries in flight at the same time before SERVFAIL/drop.
max_inflight = 4096
# Timeout for one complete client query including the upstream.
query_timeout = "3s"

[server.edns]
# Answer size for UDP; above it TC is set and the client is forced onto TCP.
udp_payload_size = 1232
# RFC 7830 / 8467: padding for encrypted transports.
padding = true

# Rate limiting per client. ON by default — a resolver without a limit is an
# amplification reflector as soon as it sees more than its own LAN
# (CLAUDE.md B.5). Above the limit queries are dropped, not rejected: an answer
# to a possibly forged sender address would be exactly the reflection the
# limiting is meant to prevent. docs/adr/0020-rate-limiting-verwirft.md
#
# Counting is per IPv4 address and per IPv6 /64: a host does not have one
# address there, but arbitrarily many from the same prefix.
[server.rate_limit]
enabled = true
# Queries per second a client is permanently entitled to.
per_client_qps = 100
# Credit a quiet client may accumulate. A page with many embeds triggers dozens
# of queries at once.
burst = 200
# Upper bound of the bookkeeping. Without it, under a flood of forged sender
# addresses the limiting itself would be the memory hog it is meant to prevent.
max_clients = 8192

# [PHASE 3+] Encrypted listeners for your own *clients* (laptop on the road,
# phone). Not to be confused with the encrypted upstreams further down: those
# exist, these listeners do not yet.
[server.doh]
enabled = false
listen = "0.0.0.0:443"
# The path token identifies the client, see [clients].
path = "/dns-query"
cert = "/etc/alpendns/tls/fullchain.pem"
key = "/etc/alpendns/tls/privkey.pem"

[server.dot]
enabled = false
listen = "0.0.0.0:853"

[server.doq]
enabled = false
listen = "0.0.0.0:853"

# ---------------------------------------------------------------------------
# Upstreams
# ---------------------------------------------------------------------------

# Upstream pools. A pool is a set of equivalent resolvers
# plus a selection strategy.
[[upstream_pool]]
name = "default"
# split_by_zone — and nothing else. The registrable domain is hashed and always
# assigned to the same upstream: no upstream sees the whole profile, and the
# cache stays effective anyway. See docs/FEATURES.md P2.
#
# fastest and round_robin existed once; with both, every upstream ended up
# seeing everything (docs/adr/0011-eine-upstream-strategie.md). fanout is gone
# as well: exactly one resolver is always asked, and the next one only on
# failure (docs/adr/0012-fanout-entfaellt.md). Both keys are now a startup error
# with a reason, not a silent ignore.
strategy = "split_by_zone"
# Interval in which the seed is drawn anew. Until phase 7 it held from start to
# restart — whoever never restarts permanently shows every provider the same
# third of their domains. "0s" restores the old behaviour.
seed_rotation = "24h"

[[upstream_pool.resolver]]
name = "quad9"
addr = "dot://9.9.9.9:853"
tls_name = "dns.quad9.net"

[[upstream_pool.resolver]]
name = "mullvad"
addr = "doh://194.242.2.4/dns-query"
tls_name = "dns.mullvad.net"

[[upstream_pool.resolver]]
name = "dnsforge"
addr = "doh://176.9.93.198/dns-query"
tls_name = "dnsforge.de"

# Conditional forwarding: internal zones never go to the internet. The only
# place where cleartext DNS is allowed — and it does not leave your own network.
[[forward_zone]]
zone = "home.arpa"
upstream = "udp://10.0.0.1:53"

[[forward_zone]]
zone = "10.in-addr.arpa"
upstream = "udp://10.0.0.1:53"

# Local zone: entries of your own that AlpenDNS answers ITSELF.
#
# The difference to forward_zone above: there AlpenDNS *asks* another
# nameserver, here it *answers*. That is why the two ways exclude each other —
# a zone that stands in both sections (or contains the other) is a startup error
# and not a question of precedence.
#
# This is a TABLE, not a zone file: no SOA, no NS, no AXFR/IXFR, no NOTIFY, no
# signing, and the AA bit stays off in the answer. AlpenDNS does not become
# authoritative through it — whoever really wants to host a zone takes Knot or
# NSD. The price for it not being a zone: changes to this table need a restart.
#
# The rebinding protection exempts the names entered here by itself, otherwise
# every local answer would stand in the UI as "Flagged" (see below).
[[local_zone]]
zone = "miloo.at"
# Validity period of all answers of this zone. 0 is allowed and means "do not
# cache"; the cache raises it to cache.min_ttl.
ttl = 300
# What happens to names for which there is NO entry here:
#   "upstream"  they are resolved as usual (default, split horizon)
#   "nxdomain"  they do not exist; the zone is closed and nothing goes out
#
# Split horizon is the default because a local table only pins down the names
# that stand in it — everything else is a zone like any other.
# Whoever wants to exempt a zone completely writes "nxdomain" and leaves out
# records:
#   [[local_zone]]
#   zone = "miloo.at"
#   fallback = "nxdomain"      # nothing from miloo.at leaves the house
# `alpendns check` says the state explicitly, because a forgotten fallback would
# otherwise weaken exactly the promise this is about.
records = [
  # "@" is the zone itself; a name is relative to the zone, absolute if it ends
  # in ".". Normalisation is to lowercase and absolute — "@", "NAS", "nas" and
  # "nas.miloo.at." are the same entry.
  #
  # A trap: a name with a dot in it, but no dot at the end, is read RELATIVE as
  # in a zone file. "nas.example.com" here means "nas.example.com.miloo.at".
  # Right for "_https._tcp" in an SRV zone, otherwise a typo that does nothing.
  # Absolute is written "nas.example.com."
  { name = "@",       type = "A",     value = "192.168.1.5" },
  { name = "nas",     type = "A",     value = "192.168.1.5" },
  # Several addresses for the same name are the normal case (dual stack,
  # round robin); double means double.
  { name = "nas",     type = "AAAA",  value = "fd00::5" },
  # A CNAME is answered as it stands — AlpenDNS does not resolve it itself. The
  # client asks for the target name afterwards and hits the same table.
  { name = "drucker", type = "CNAME", value = "nas" },
  # TXT values with spaces need the notation from the zone file, so that the
  # lexer reads them as one string:
  { name = "_dmarc",  type = "TXT",   value = '"v=DMARC1; p=none"' },
]

# v1 knows exactly six types: A, AAAA, CNAME, TXT, PTR and SRV. Everything else
# (MX, NS, SOA, DNSKEY …) is a startup error with a reason instead of a silent
# ignore — a table is not a zone file.
#
# A missing type is NODATA, even with fallback = "upstream": if "nas" stands in
# the table with A and a client asks for AAAA, it gets "does not exist" and not
# the upstream's answer. Otherwise a name would have two horizons, and a foreign
# type would be the back door out of the zone.
#
# Reverse zones are NOT created automatically from the A records. `dig -x
# 192.168.1.5` needs a zone of its own:
#   [[local_zone]]
#   zone = "1.168.192.in-addr.arpa"
#   records = [{ name = "5", type = "PTR", value = "nas.miloo.at." }]

# ---------------------------------------------------------------------------
# Cache
# ---------------------------------------------------------------------------

[cache]
max_entries = 100_000
min_ttl = "10s"
max_ttl = "24h"
# Negative answers (NXDOMAIN/NODATA) get their own TTL cap.
max_negative_ttl = "15m"
# Serve stale (RFC 8767): hand out expired answers when the upstream is not
# reachable. Raises availability, can deliver outdated IPs.
serve_stale = true
serve_stale_max = "1h"
# Prefetch: renew entries that are queried often shortly before they expire.
prefetch = true
prefetch_threshold = 0.85

# ---------------------------------------------------------------------------
# Privacy
# ---------------------------------------------------------------------------

[privacy]
# Never pass EDNS Client Subnet on to upstreams.
strip_ecs = true
# DNS Cookies (RFC 7873) against off-path spoofing.
cookies = true
# 0x20 encoding: random upper/lower case in the QNAME towards upstreams.
# Some upstreams react badly to it — that is why it can be switched off per pool.
dns0x20 = true
# Recompute the signature chain yourself instead of believing the upstream's AD
# bit. An answer whose zone claims to be signed and whose chain does not close
# is dropped (SERVFAIL) — standard behaviour per RFC 4035. Costs a few extra
# queries to the same upstream per new zone. Switched off, what the upstream
# claims holds again.
dnssec = true
# Oblivious DoH (RFC 9230): the proxy knows your address but not the query; the
# target knows the query but not your address.
#
# Two conditions, otherwise it is theatre:
#   1. Proxy and target must NOT belong to the same operator. The server cannot
#      check that — that is your choice.
#   2. All resolvers in the pool must speak doh://; ODoH exists over HTTP only.
#      A dot:// in the pool with odoh switched on is a startup error, instead of
#      silently doing nothing for half the queries.
#
# A limit that remains: the process fetches the target's public key once per
# start directly from its /.well-known/odohconfigs. That one connection does not
# go through the proxy — the target sees your address while doing so, but not a
# single question. See docs/adr/0017-oblivious-doh.md.
odoh = { enabled = false, proxy = "https://odoh-proxy.example/proxy" }

[privacy.logging]
# none      — no query names, neither on disk nor in RAM
# aggregate — only counters and top-N above the threshold (k-anonymity); counted
#             exactly, under a salted hash rather than under the name
# ring      — the last N seconds in RAM for debugging, never persisted
# full      — query log on disk. A deliberate decision, not the default.
#             /etc/logrotate.d/alpendns then decides how long the names lie
#             there ("rotate 7" = seven days). See docs/OPERATIONS.md §6.
mode = "aggregate"
ring_seconds = 300
# Below this count a domain appears in no statistic.
aggregate_k = 5

# ---------------------------------------------------------------------------
# Blocking
# ---------------------------------------------------------------------------

[blocking]
# nxdomain | zero_ip | sinkhole
# sinkhole shows an explanation page for HTTP; for HTTPS the connection
# inevitably breaks, which is why it is not the default.
#
# refused existed once. It told the client to ask the next resolver on its list
# and thereby lifted the filtering
# (docs/adr/0013-block-modus-refused-entfaellt.md).
mode = "nxdomain"
sinkhole_ipv4 = "127.0.0.1"
sinkhole_ipv6 = "::1"

[[blocklist]]
name = "stevenblack-unified"
url = "https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts"
# hosts | domains | wildcard. adblock and rpz existed once; both parsers skipped
# the exception rules of their format and thereby loaded lists more strictly
# than intended (docs/adr/0014-adblock-und-rpz-parser-entfallen.md).
format = "hosts"
refresh = "24h"
enabled = true

[[blocklist]]
name = "oisd-big"
url = "https://big.oisd.nl/domainswild"
format = "wildcard"
refresh = "24h"
enabled = true

# Local lists always take precedence over remote ones.
[[allowlist]]
name = "local-allow"
path = "/etc/alpendns/allow.txt"
format = "domains"

# ---------------------------------------------------------------------------
# Clients and policies
# ---------------------------------------------------------------------------

[[client]]
name = "kids-tablet"
# Identification, evaluated in this order:
match = { ip = ["10.0.10.42"] }
policy = "kids"

[[client]]
name = "florian-laptop"
# Identified via DoH path token, works on the road too.
match = { doh_token = "REPLACE_WITH_RANDOM_32_BYTES" }
policy = "default"

[[policy]]
name = "default"
blocklists = ["stevenblack-unified", "oisd-big"]
allowlists = ["local-allow"]

[[policy]]
name = "kids"
blocklists = ["stevenblack-unified", "oisd-big"]
allowlists = ["local-allow"]
# Time windows during which additional blocking applies.
[[policy.schedule]]
name = "bedtime"
days = ["mon", "tue", "wed", "thu", "sun"]
from = "21:00"
to = "07:00"
action = "block_all_except_allowlist"

# ---------------------------------------------------------------------------
# Heuristics / detection
# ---------------------------------------------------------------------------

# Every heuristic delivers a score 0.0–1.0 and a reason. Four levels:
#
#   off    does not run, costs nothing
#   log    runs and counts along, nothing else
#   flag   runs, counts along, and the query stands in the "Flagged" list
#   block  the query is blocked like a blocklist hit
#
# ALL FIVE ARE ON `flag` BY DEFAULT, and that is deliberate. A detector that
# breaks the internet is switched off — and all the others with it.
# The way to `block` goes through a week of observation: review the "Flagged"
# list, take the false positives into `allow_zones` or onto an allowlist, and
# only then switch over. See docs/ROADMAP.md, phase 8 acceptance.
#
# The thresholds are measured and not guessed; the numbers behind them are in
# docs/BENCHMARKS.md. Whoever changes them should look there for what it costs.
[detection]

# Algorithmically generated names (kqxvbnzmrt.com). 3-gram model in the binary.
# Measured on 100,000 real domains: 0.077% false positives at this threshold.
# Detects randomly looking names; dictionary-based DGAs and short names
# explicitly not — see docs/FEATURES.md D3.
dga = { action = "flag", threshold = 0.75 }

# Data exfiltration over DNS. What is assessed is the *zone* over a time window,
# not the individual query: one long random subdomain is normal, a thousand of
# them under the same zone are not.
# allow_zones is for reputation services and antivirus products that look like a
# tunnel by construction.
tunneling = { action = "flag", threshold = 0.75, window = "5m", allow_zones = [] }

# Private IPs in answers for public names.
# The forward_zone entries from above are added automatically — whoever routes a
# zone into their own network has already said that private addresses from there
# are fine. The same holds for the local zones, but per name: `nas.miloo.at` is
# exempt, `www.miloo.at` is not — that one still comes from outside, and a
# private address on it would be exactly the attack. A closed zone
# (fallback = "nxdomain") is exempt as a whole, nothing comes out of it anyway.
# Only the additional exceptions stand here: split-horizon DNS, device web
# interfaces under a real name.
rebinding = { action = "flag", allow_zones = [] }

# Typosquatting relative to domains that matter to YOU — not against a global
# phishing list. Without entries the detector does nothing; it then has nothing
# to compare against and appears in the status as `off`.
typosquat = { action = "flag", threshold = 0.85, protect = [
  "sparkasse.at",
  "id.austria.gv.at",
  "hale.at",
] }

# Newly registered domains, age from a local file (AlpenShield feed).
# If the file is missing, the detector runs empty — the resolver does not depend
# on a second service having run. Without `source` it stays off.
nrd = { action = "flag", max_age = "30d", source = "/var/lib/alpendns/nrd.txt" }

# ---------------------------------------------------------------------------
# API, UI, metrics
# ---------------------------------------------------------------------------

[api]
enabled = true
listen = "127.0.0.1:8053"
# Token auth; the UI is served by the same process.
token_file = "/etc/alpendns/api.token"

[metrics]
enabled = true
listen = "127.0.0.1:9153"
path = "/metrics"
