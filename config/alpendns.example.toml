# AlpenDNS — Beispielkonfiguration
#
# Diese Datei ist die ZIEL-Konfiguration, nicht der Stand der Implementierung.
# Sie dient als Spezifikation: jede Phase in docs/ROADMAP.md aktiviert einen Teil davon.
# Abschnitte, die noch nicht implementiert sind, sind mit [PHASE n] markiert.
#
# Konvention: der Server startet nur, wenn die Konfiguration vollständig geparst werden
# kann. Unbekannte Schlüssel sind ein Fehler, kein Warning (siehe CLAUDE.md).

[server]
# Listener für unverschlüsseltes DNS im LAN.
listen_udp = ["0.0.0.0:53", "[::]:53"]
listen_tcp = ["0.0.0.0:53", "[::]:53"]
# Maximale gleichzeitig in Bearbeitung befindliche Anfragen, bevor SERVFAIL/Drop.
max_inflight = 4096
# Timeout für eine komplette Client-Anfrage inkl. Upstream.
query_timeout = "3s"

[server.edns]
# Antwortgröße für UDP; darüber wird TC gesetzt und der Client auf TCP gezwungen.
udp_payload_size = 1232
# RFC 7830 / 8467: Padding für verschlüsselte Transporte.
padding = true

# Drosselung pro Client. Per Default AN — ein Resolver ohne Limit ist ein
# Amplification-Reflektor, sobald er nicht mehr nur sein eigenes LAN sieht
# (CLAUDE.md B.5). Über dem Limit wird verworfen, nicht abgelehnt: eine
# Antwort an eine womöglich gefälschte Absenderadresse wäre genau die
# Reflexion, gegen die gedrosselt wird. docs/adr/0020-rate-limiting-verwirft.md
#
# Gezählt wird je IPv4-Adresse und je IPv6-/64: ein Host hat dort nicht eine
# Adresse, sondern beliebig viele aus demselben Präfix.
[server.rate_limit]
enabled = true
# Anfragen je Sekunde, die einem Client dauerhaft zustehen.
per_client_qps = 100
# Guthaben, das ein stiller Client ansammeln darf. Eine Seite mit vielen
# Einbettungen löst auf einen Schlag Dutzende Anfragen aus.
burst = 200
# Obergrenze der Buchführung. Ohne sie wäre die Drosselung bei einer Flut
# gefälschter Absender selbst der Speicherfresser, den sie verhindern soll.
max_clients = 8192

# [PHASE 3+] Verschlüsselte Listener für eigene *Clients* (Laptop unterwegs,
# Handy). Nicht zu verwechseln mit den verschlüsselten Upstreams weiter unten:
# die gibt es, diese Listener noch nicht.
[server.doh]
enabled = false
listen = "0.0.0.0:443"
# Pfad-Token identifiziert den Client, siehe [clients].
path = "/dns-query"
cert = "/etc/alpendns/tls/fullchain.pem"
key = "/etc/alpendns/tls/privkey.pem"

[server.dot]
enabled = false
listen = "0.0.0.0:853"

[server.doq]
enabled = false
listen = "0.0.0.0:853"

# ---------------------------------------------------------------------------
# Upstreams
# ---------------------------------------------------------------------------

# Upstream-Pools. Ein Pool ist eine Menge gleichwertiger Resolver
# plus eine Auswahlstrategie.
[[upstream_pool]]
name = "default"
# split_by_zone — und sonst nichts. Die Registrable Domain wird gehasht und
# immer demselben Upstream zugewiesen: kein Upstream sieht das ganze Profil,
# der Cache bleibt trotzdem wirksam. Siehe docs/FEATURES.md P2.
#
# fastest und round_robin gab es einmal; bei beiden sah am Ende jeder Upstream
# alles (docs/adr/0011-eine-upstream-strategie.md). Ebenso weg ist fanout: es
# wird immer genau ein Resolver gefragt und erst beim Ausfall der nächste
# (docs/adr/0012-fanout-entfaellt.md). Beide Schlüssel sind jetzt ein
# Startfehler mit Begründung, kein stilles Ignorieren.
strategy = "split_by_zone"
# Abstand, in dem der Seed neu gezogen wird. Bis Phase 7 galt er vom Start bis
# zum Neustart — wer nie neu startet, gibt jedem Anbieter dauerhaft dasselbe
# Drittel seiner Domains zu sehen. "0s" stellt das alte Verhalten wieder her.
seed_rotation = "24h"

[[upstream_pool.resolver]]
name = "quad9"
addr = "dot://9.9.9.9:853"
tls_name = "dns.quad9.net"

[[upstream_pool.resolver]]
name = "mullvad"
addr = "doh://194.242.2.4/dns-query"
tls_name = "dns.mullvad.net"

[[upstream_pool.resolver]]
name = "dnsforge"
addr = "doh://176.9.93.198/dns-query"
tls_name = "dnsforge.de"

# Conditional Forwarding: interne Zonen gehen nie ins Internet. Der einzige Ort,
# an dem Klartext-DNS erlaubt ist — und er verlässt das eigene Netz nicht.
[[forward_zone]]
zone = "home.arpa"
upstream = "udp://10.0.0.1:53"

[[forward_zone]]
zone = "10.in-addr.arpa"
upstream = "udp://10.0.0.1:53"

# Lokale Zone: eigene Einträge, die AlpenDNS SELBST beantwortet.
#
# Der Unterschied zu forward_zone oben: dort *fragt* AlpenDNS einen anderen
# Nameserver, hier *antwortet* es. Deshalb schließen sich die beiden Wege aus —
# eine Zone, die in beiden Sektionen steht (oder die andere enthält), ist ein
# Startfehler und keine Frage des Vorrangs.
#
# Das ist eine TABELLE, kein Zonenfile: kein SOA, kein NS, kein AXFR/IXFR, kein
# NOTIFY, kein Signieren, und das AA-Bit bleibt in der Antwort aus. AlpenDNS
# wird davon nicht autoritativ — wer eine Zone wirklich hosten will, nimmt Knot
# oder NSD. Der Preis dafür, dass es keine Zone ist: Änderungen an dieser
# Tabelle brauchen einen Neustart.
#
# Der Rebinding-Schutz nimmt die eingetragenen Namen von selbst aus, sonst
# stünde jede lokale Antwort als "auffällig" in der Oberfläche (siehe unten).
[[local_zone]]
zone = "miloo.at"
# Gültigkeitsdauer aller Antworten dieser Zone. 0 ist erlaubt und heißt "nicht
# zwischenspeichern"; der Cache hebt es auf cache.min_ttl an.
ttl = 300
# Was mit Namen geschieht, für die es hier KEINEN Eintrag gibt:
#   "upstream"  sie werden wie gewohnt aufgelöst (Default, Split-Horizon)
#   "nxdomain"  es gibt sie nicht; die Zone ist zu und nichts geht hinaus
#
# Split-Horizon ist der Default, weil eine lokale Tabelle nur die Namen
# festnagelt, die in ihr stehen — alles andere ist eine Zone wie jede andere.
# Wer eine Zone vollständig ausnehmen will, schreibt "nxdomain" und lässt
# records weg:
#   [[local_zone]]
#   zone = "miloo.at"
#   fallback = "nxdomain"      # nichts aus miloo.at verlässt das Haus
# `alpendns check` sagt den Zustand ausdrücklich hin, weil ein vergessener
# fallback sonst genau die Zusage abschwächt, um die es geht.
records = [
  # "@" ist die Zone selbst; ein Name ist relativ zur Zone, absolut wenn er auf
  # "." endet. Normalisiert wird auf kleingeschrieben und absolut — "@", "NAS",
  # "nas" und "nas.miloo.at." sind derselbe Eintrag.
  #
  # Eine Falle: ein Name mit Punkt darin, aber ohne Punkt am Ende, wird wie in
  # einem Zonenfile RELATIV gelesen. "nas.example.com" heißt hier also
  # "nas.example.com.miloo.at". Für "_https._tcp" in einer SRV-Zone richtig,
  # sonst ein Tippfehler, der nichts tut. Absolut schreibt man
  # "nas.example.com."
  { name = "@",       type = "A",     value = "192.168.1.5" },
  { name = "nas",     type = "A",     value = "192.168.1.5" },
  # Mehrere Adressen für denselben Namen sind der Normalfall (dual-stack,
  # Round-Robin); doppelt heißt doppelt.
  { name = "nas",     type = "AAAA",  value = "fd00::5" },
  # Ein CNAME wird beantwortet, wie er dasteht — AlpenDNS löst ihn nicht selbst
  # auf. Den Zielnamen fragt der Client danach nach und trifft dieselbe Tabelle.
  { name = "drucker", type = "CNAME", value = "nas" },
  # TXT-Werte mit Leerzeichen brauchen die Schreibweise aus dem Zonenfile,
  # damit der Lexer sie als einen String liest:
  { name = "_dmarc",  type = "TXT",   value = '"v=DMARC1; p=none"' },
]

# v1 kennt genau sechs Typen: A, AAAA, CNAME, TXT, PTR und SRV. Alles andere
# (MX, NS, SOA, DNSKEY …) ist ein Startfehler mit Begründung statt eines stillen
# Ignorierens — eine Tabelle ist kein Zonenfile.
#
# Ein fehlender Typ ist NODATA, auch bei fallback = "upstream": steht "nas" mit
# A in der Tabelle und ein Client fragt AAAA, bekommt er "gibt es nicht" und
# nicht die Antwort des Upstreams. Sonst hätte ein Name zwei Horizonte, und ein
# fremder Typ wäre die Hintertür aus der Zone.
#
# Reverse-Zonen entstehen NICHT automatisch aus den A-Records. `dig -x
# 192.168.1.5` braucht eine eigene Zone:
#   [[local_zone]]
#   zone = "1.168.192.in-addr.arpa"
#   records = [{ name = "5", type = "PTR", value = "nas.miloo.at." }]

# ---------------------------------------------------------------------------
# Cache
# ---------------------------------------------------------------------------

[cache]
max_entries = 100_000
min_ttl = "10s"
max_ttl = "24h"
# Negative Antworten (NXDOMAIN/NODATA) eigener TTL-Deckel.
max_negative_ttl = "15m"
# Serve-stale (RFC 8767): abgelaufene Antworten ausliefern, wenn der Upstream
# nicht erreichbar ist. Erhöht Verfügbarkeit, kann veraltete IPs liefern.
serve_stale = true
serve_stale_max = "1h"
# Prefetch: Einträge, die oft abgefragt werden, kurz vor Ablauf erneuern.
prefetch = true
prefetch_threshold = 0.85

# ---------------------------------------------------------------------------
# Privacy
# ---------------------------------------------------------------------------

[privacy]
# EDNS Client Subnet niemals an Upstreams weitergeben.
strip_ecs = true
# DNS Cookies (RFC 7873) gegen Off-Path-Spoofing.
cookies = true
# 0x20 Encoding: zufällige Groß-/Kleinschreibung im QNAME zu Upstreams.
# Manche Upstreams reagieren allergisch — deshalb per Pool abschaltbar.
dns0x20 = true
# Die Signaturkette selbst nachrechnen, statt dem AD-Bit des Upstreams zu
# glauben. Eine Antwort, deren Zone sich als signiert ausgibt und deren Kette
# nicht schließt, wird verworfen (SERVFAIL) — Standardverhalten nach RFC 4035.
# Kostet je neuer Zone ein paar zusätzliche Anfragen an denselben Upstream.
# Ausgeschaltet gilt wieder, was der Upstream behauptet.
dnssec = true
# Oblivious DoH (RFC 9230): Der Proxy kennt deine Adresse, aber nicht die
# Anfrage; das Ziel kennt die Anfrage, aber nicht deine Adresse.
#
# Zwei Bedingungen, sonst ist es Theater:
#   1. Proxy und Ziel dürfen NICHT demselben Betreiber gehören. Das kann der
#      Server nicht prüfen — das ist deine Auswahl.
#   2. Alle Resolver im Pool müssen doh:// sprechen; ODoH gibt es nur über
#      HTTP. Ein dot:// im Pool ist bei eingeschaltetem odoh ein Startfehler,
#      statt für die Hälfte der Anfragen still nichts zu tun.
#
# Grenze, die bleibt: den öffentlichen Schlüssel des Ziels holt der Prozess
# einmal je Start direkt von dessen /.well-known/odohconfigs. Diese eine
# Verbindung geht nicht über den Proxy — das Ziel sieht dabei deine Adresse,
# aber keine einzige Frage. Siehe docs/adr/0017-oblivious-doh.md.
odoh = { enabled = false, proxy = "https://odoh-proxy.example/proxy" }

[privacy.logging]
# none      — keine Query-Namen, weder auf Platte noch im RAM
# aggregate — nur Zähler und Top-N über Schwellwert (k-Anonymität); gezählt wird
#             exakt unter einem gesalzenen Hash, nicht unter dem Namen
# ring      — letzte N Sekunden im RAM für Debugging, nie persistiert
# full      — Query-Log auf Platte. Bewusste Entscheidung, nicht Default.
#             Dann entscheidet /etc/logrotate.d/alpendns, wie lange die Namen
#             dort liegen ("rotate 7" = sieben Tage). Siehe docs/OPERATIONS.md §6.
mode = "aggregate"
ring_seconds = 300
# Unter diesem Zählerstand taucht eine Domain in keiner Statistik auf.
aggregate_k = 5

# ---------------------------------------------------------------------------
# Blocking
# ---------------------------------------------------------------------------

[blocking]
# nxdomain | zero_ip | sinkhole
# sinkhole zeigt für HTTP eine Erklärseite; für HTTPS bricht die Verbindung
# unvermeidlich ab, deshalb nicht Default.
#
# refused gab es einmal. Es wies den Client an, den nächsten Resolver seiner
# Liste zu fragen, und hob damit die Filterung auf
# (docs/adr/0013-block-modus-refused-entfaellt.md).
mode = "nxdomain"
sinkhole_ipv4 = "127.0.0.1"
sinkhole_ipv6 = "::1"

[[blocklist]]
name = "stevenblack-unified"
url = "https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts"
# hosts | domains | wildcard. adblock und rpz gab es einmal; beide Parser
# übersprangen die Ausnahmeregeln ihres Formats und luden Listen damit schärfer
# als gemeint (docs/adr/0014-adblock-und-rpz-parser-entfallen.md).
format = "hosts"
refresh = "24h"
enabled = true

[[blocklist]]
name = "oisd-big"
url = "https://big.oisd.nl/domainswild"
format = "wildcard"
refresh = "24h"
enabled = true

# Lokale Listen haben immer Vorrang vor entfernten.
[[allowlist]]
name = "local-allow"
path = "/etc/alpendns/allow.txt"
format = "domains"

# ---------------------------------------------------------------------------
# Clients und Policies
# ---------------------------------------------------------------------------

[[client]]
name = "kids-tablet"
# Identifikation, in dieser Reihenfolge ausgewertet:
match = { ip = ["10.0.10.42"] }
policy = "kids"

[[client]]
name = "florian-laptop"
# Über DoH-Pfad-Token identifiziert, funktioniert auch unterwegs.
match = { doh_token = "REPLACE_WITH_RANDOM_32_BYTES" }
policy = "default"

[[policy]]
name = "default"
blocklists = ["stevenblack-unified", "oisd-big"]
allowlists = ["local-allow"]

[[policy]]
name = "kids"
blocklists = ["stevenblack-unified", "oisd-big"]
allowlists = ["local-allow"]
# Zeitfenster, in denen zusätzlich blockiert wird.
[[policy.schedule]]
name = "bedtime"
days = ["mon", "tue", "wed", "thu", "sun"]
from = "21:00"
to = "07:00"
action = "block_all_except_allowlist"

# ---------------------------------------------------------------------------
# Heuristik / Detection
# ---------------------------------------------------------------------------

# Jede Heuristik liefert einen Score 0.0–1.0 und eine Begründung. Vier Stufen:
#
#   off    läuft nicht, kostet nichts
#   log    läuft und zählt mit, sonst nichts
#   flag   läuft, zählt mit, und die Anfrage steht in der Liste "Auffällig"
#   block  die Anfrage wird geblockt wie ein Blocklisten-Treffer
#
# ALLE FÜNF STEHEN PER DEFAULT AUF `flag`, und das ist Absicht. Ein Detektor,
# der Internet kaputtmacht, wird abgeschaltet — und mit ihm alle anderen.
# Der Weg zu `block` führt über eine Woche Beobachtung: die Liste "Auffällig"
# durchsehen, die Fehlalarme in `allow_zones` bzw. auf eine Allowlist nehmen,
# und erst dann umstellen. Siehe docs/ROADMAP.md, Abnahme Phase 8.
#
# Die Schwellen sind gemessen und nicht geraten; die Zahlen dahinter stehen in
# docs/BENCHMARKS.md. Wer sie ändert, sollte dort nachsehen, was das kostet.
[detection]

# Algorithmisch erzeugte Namen (kqxvbnzmrt.com). 3-Gramm-Modell im Binary.
# Gemessen auf 100 000 echten Domains: 0,077 % Fehlalarme bei dieser Schwelle.
# Erkennt zufällig aussehende Namen; wörterbuchbasierte DGAs und kurze Namen
# ausdrücklich nicht — siehe docs/FEATURES.md D3.
dga = { action = "flag", threshold = 0.75 }

# Datenexfiltration über DNS. Bewertet wird die *Zone* über ein Zeitfenster,
# nicht die einzelne Anfrage: eine lange zufällige Subdomain ist normal,
# tausend davon unter derselben Zone nicht.
# allow_zones ist für Reputationsdienste und Antivirus-Produkte, die per
# Konstruktion wie ein Tunnel aussehen.
tunneling = { action = "flag", threshold = 0.75, window = "5m", allow_zones = [] }

# Private IPs in Antworten für öffentliche Namen.
# Die forward_zone-Einträge von oben kommen automatisch dazu — wer eine Zone
# ins eigene Netz leitet, hat schon gesagt, dass private Adressen von dort in
# Ordnung sind. Dasselbe gilt für die lokalen Zonen, aber je Name: `nas.miloo.at`
# ist ausgenommen, `www.miloo.at` nicht — das kommt weiterhin von draußen, und
# eine private Adresse darauf wäre genau der Angriff. Eine geschlossene Zone
# (fallback = "nxdomain") ist als Ganzes ausgenommen, aus ihr kommt ohnehin
# nichts mehr nach draußen.
# Hier stehen nur die zusätzlichen Ausnahmen: Split-Horizon-DNS, Geräte-
# Weboberflächen unter einem echten Namen.
rebinding = { action = "flag", allow_zones = [] }

# Typosquatting relativ zu Domains, die DIR wichtig sind — nicht gegen eine
# globale Phishing-Liste. Ohne Einträge tut der Detektor nichts; er hat dann
# nichts, wogegen er vergleichen könnte, und erscheint im Status als `off`.
typosquat = { action = "flag", threshold = 0.85, protect = [
  "sparkasse.at",
  "id.austria.gv.at",
  "hale.at",
] }

# Neu registrierte Domains, Alter aus lokaler Datei (AlpenShield-Feed).
# Fehlt die Datei, läuft der Detektor leer mit — der Resolver hängt nicht
# davon ab, dass ein zweiter Dienst gelaufen ist. Ohne `source` bleibt er aus.
nrd = { action = "flag", max_age = "30d", source = "/var/lib/alpendns/nrd.txt" }

# ---------------------------------------------------------------------------
# API, UI, Metriken
# ---------------------------------------------------------------------------

[api]
enabled = true
listen = "127.0.0.1:8053"
# Token-Auth; die UI wird vom selben Prozess ausgeliefert.
token_file = "/etc/alpendns/api.token"

[metrics]
enabled = true
listen = "127.0.0.1:9153"
path = "/metrics"
