# AlpenDNS — lauffähige Minimalkonfiguration.
#
# Die vollständige Ziel-Konfiguration steht in alpendns.example.toml. Diese Datei
# enthält nur die Schlüssel, die schon umgesetzt sind (Stand: Phase 7) — mehr
# akzeptiert der Server auch nicht: unbekannte Schlüssel sind ein Startfehler,
# kein Warning.
#

[server]
# 5353 statt 53, damit der Server ohne besondere Rechte startet.
listen_udp = ["127.0.0.1:5353"]
listen_tcp = ["127.0.0.1:5353"]
query_timeout = "3s"

[server.edns]
# Ab dieser Antwortgröße wird über UDP das TC-Flag gesetzt (DNS Flag Day 2020).
udp_payload_size = 1232

# Alle Werte hier sind auch die Defaults; die Drosselung ist an, ohne dass man
# sie hinschreiben müsste. Über dem Limit wird verworfen, nicht abgelehnt —
# docs/adr/0020-rate-limiting-verwirft.md
[server.rate_limit]
enabled = true
per_client_qps = 100
burst = 200
max_clients = 8192

# Alle Werte hier sind auch die Defaults; sie stehen nur da, um sichtbar zu sein.
[cache]
max_entries = 100_000
min_ttl = "10s"
max_ttl = "24h"
max_negative_ttl = "15m"
# Abgelaufene Antworten weiter ausliefern und parallel auffrischen (RFC 8767).
serve_stale = true
serve_stale_max = "1h"
# Oft gefragte Einträge bei 85 % der TTL im Hintergrund erneuern.
prefetch = true
prefetch_threshold = 0.85

[privacy]
# EDNS Client Subnet niemals an Upstreams weitergeben.
strip_ecs = true
# EDNS-Padding auf verschlüsselten Transporten: sonst verrät die Länge der
# Nachricht, wie lang der angefragte Name ist.
padding = true
# DNS Cookies (RFC 7873) gegen Off-Path-Spoofing, wie 0x20 nur im Klartext.
cookies = true
# 0x20: zufällige Groß-/Kleinschreibung im QNAME. Wirkt auf dem Klartext-Weg
# (forward_zone) gegen Off-Path-Spoofing; auf TLS ist es überflüssig und wird
# dort nicht angewendet. Spiegelt ein Server die Schreibweise nicht, wird es
# für ihn automatisch abgeschaltet, statt Anfragen scheitern zu lassen.
dns0x20 = true

[[upstream_pool]]
name = "default"
# split_by_zone ist die einzige Strategie und der Default; die Zeile steht nur
# da, um sichtbar zu sein. Domains werden über einen beim Start zufällig
# gezogenen Seed verteilt: derselbe Name geht immer zum selben Resolver, aber
# jeder sieht nur einen Bruchteil — und nach einem Neustart einen anderen.
# Siehe docs/FEATURES.md P2.
#
# fastest, round_robin und fanout gab es einmal. Sie sind entfernt, weil bei
# allen dreien am Ende jeder Upstream alles sieht; wer sie noch in seiner
# Konfiguration stehen hat, bekommt beim Start eine Meldung mit Begründung.
# docs/adr/0011-eine-upstream-strategie.md, docs/adr/0012-fanout-entfaellt.md
strategy = "split_by_zone"

# Klartext (udp://) ist hier nicht erlaubt und wird beim Start abgelehnt.
# tls_name ist Pflicht: ohne ihn wird das Zertifikat gegen nichts geprüft.
[[upstream_pool.resolver]]
name = "quad9"
addr = "dot://9.9.9.9:853"
tls_name = "dns.quad9.net"

[[upstream_pool.resolver]]
name = "mullvad"
addr = "doh://194.242.2.4/dns-query"
tls_name = "dns.mullvad.net"

# Zonen im eigenen Netz. Der einzige Ort, an dem Klartext erlaubt ist — und die
# Anfrage verlässt dabei das eigene Netz nicht.
# [[forward_zone]]
# zone = "home.arpa"
# upstream = "udp://10.0.0.1:53"

# ---------------------------------------------------------------------------
# Blocken
# ---------------------------------------------------------------------------

[blocking]
# nxdomain | zero_ip | sinkhole
#
# nxdomain ist der ruhigste Default: der Client gibt sofort auf, statt in einen
# Timeout zu laufen (zero_ip) oder am Zertifikat zu scheitern (sinkhole).
#
# refused ist entfernt — es schickte den Client zum nächsten Resolver seiner
# Liste und hob damit die Filterung auf, während der Blockzähler weiter stieg.
# docs/adr/0013-block-modus-refused-entfaellt.md
mode = "nxdomain"
sinkhole_ipv4 = "127.0.0.1"
sinkhole_ipv6 = "::1"
# Heruntergeladene Listen landen hier, damit ein Neustart ohne Internet
# gefiltert startet. Im Betrieb ist /var/cache/alpendns/lists der Default;
# hier relativ, damit es ohne root läuft.
cache_dir = "./lists"

# ACHTUNG: Ohne erreichbare Liste bricht der *erste* Start ab — lieber kein DNS
# als ungefiltertes DNS. Ein späterer Ausfall ist dagegen unkritisch, dann gilt
# die zwischengespeicherte Fassung weiter.
[[blocklist]]
name = "stevenblack-unified"
url = "https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts"
# hosts | domains | wildcard
#
# adblock und rpz sind entfernt: beide Parser verstanden nur den Blockteil ihres
# Formats und übersprangen dessen Ausnahmeregeln, luden eine Liste also schärfer
# als gemeint. Eine Adblock-Zeile `||name^` entspricht in einer wildcard-Liste
# der Zeile `name`. docs/adr/0014-adblock-und-rpz-parser-entfallen.md
format = "hosts"
refresh = "24h"
enabled = true

# Lokale Ausnahmen. Die Allowlist schlägt jede Blockliste.
# [[allowlist]]
# name = "lokal"
# path = "./allow.txt"
# format = "wildcard"

# ---------------------------------------------------------------------------
# Clients und Policies
# ---------------------------------------------------------------------------
#
# Ohne diesen Abschnitt gilt eine Regel für alle: eine Policy namens "default",
# die alle konfigurierten Listen benutzt. Sobald hier ein [[client]] steht,
# muss es auch eine [[policy]] namens "default" geben — für alles, was keinem
# Client-Eintrag entspricht.
#
# Reihenfolge der Auswertung: befristete Freigabe → Allowlist → Blocklisten →
# Regex → Zeitplan. Die Allowlist steht vorn, weil sie sonst keinen Zweck hätte.
#
# Prüfen, ohne den Server zu starten:
#   alpendns -c <datei> policy test <domain> [--client <name>]

# [[client]]
# name = "kids-tablet"
# match = { ip = ["10.0.10.42", "10.0.11.0/24"] }
# policy = "kids"
#
# [[policy]]
# name = "default"
# blocklists = ["stevenblack-unified"]
#
# [[policy]]
# name = "kids"
# blocklists = ["stevenblack-unified"]
# regex = ["(?:^|\\.)spiele\\."]
#
# [[policy.schedule]]
# name = "bedtime"
# days = ["mon", "tue", "wed", "thu", "sun"]
# from = "21:00"
# to = "07:00"
# action = "block_all_except_allowlist"

# ---------------------------------------------------------------------------
# Sichtbarkeit
# ---------------------------------------------------------------------------

[privacy.logging]
# none      — nur Zähler, keine Namen
# aggregate — zusätzlich Häufigkeiten; eine Domain erscheint erst ab
#             aggregate_k Treffern in irgendeiner Ausgabe (Default). Gezählt
#             wird exakt, unter einem gesalzenen Hash statt unter dem Namen —
#             darunter steht der Name nirgends.
# ring      — zusätzlich die letzten ring_seconds im Arbeitsspeicher, nie auf
#             Platte. Das ist der Modus, in dem die UI Namen zeigen kann.
# full      — zusätzlich als Datei. Bewusste Entscheidung, kein Default.
#
# Begründung der vier Modi: docs/adr/0004-logging-default-aggregiert.md
mode = "aggregate"
ring_seconds = "5m"
aggregate_k = 5
# Nur im Modus full:
# path = "/var/log/alpendns/queries.jsonl"

# Beide Endpunkte sind per Default aus und gehören auf localhost. Wer sie von
# außen erreichbar macht, veröffentlicht sein Query-Log, sobald der Token
# bekannt wird — der Weg dafür ist ein SSH-Tunnel oder ein Reverse Proxy.
[api]
enabled = true
listen = "127.0.0.1:8053"
# Fehlt die Datei, wird beim Start ein Token erzeugt und mit Rechten 0600
# abgelegt. Die UI fragt ihn beim ersten Aufruf ab.
#
# Hier relativ, damit diese Datei ohne root läuft. Im Betrieb liegt der Token
# unter /var/lib/alpendns — und nicht unter /etc, weil die systemd-Unit
# ProtectSystem=strict setzt und /etc für den Dienst schreibgeschützt ist.
token_file = "./alpendns-api.token"

[metrics]
# Ohne Token — ein Prometheus-Scraper schickt keinen Bearer-Header, und die
# Ausgabe enthält per Konstruktion keine Namen. Deshalb muss dieser Port ein
# anderer sein als der der API; die Konfigurationsprüfung besteht darauf.
enabled = false
listen = "127.0.0.1:9153"
path = "/metrics"
