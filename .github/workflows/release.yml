name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  deb:
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            arch: amd64
          - runs-on: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked
      - name: Build the package
        run: cargo deb -p alpendns
      - name: Store the package
        uses: actions/upload-artifact@v7
        with:
          name: alpendns-deb-${{ matrix.arch }}
          path: target/debian/*.deb

  publish:
    needs: deb
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the packages
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Read and check the version
        id: v
        run: |
          version="$(sed -nE 's/^version = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' Cargo.toml | head -n1)"
          lock_version="$(sed -nE '/^name = "alpendns"$/,/^$/ s/^version = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' Cargo.lock)"
          if [ -z "$version" ]; then
            echo "no version found in Cargo.toml" >&2
            exit 1
          fi
          if [ "$lock_version" != "$version" ]; then
            echo "Cargo.lock (alpendns: $lock_version) and Cargo.toml ($version) have diverged — scripts/bump-version.sh applies both." >&2
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the version in Cargo.toml (v$version)." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.v.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.deb --clobber
          else
            gh release create "$tag" dist/*.deb --generate-notes --target "$GITHUB_SHA"
          fi
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/florianpunz/alpendns:${{ steps.v.outputs.version }}
            ghcr.io/florianpunz/alpendns:latest

  apt:
    needs: deb
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch the packages
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Read the version
        id: v
        run: |
          version="$(sed -nE 's/^version = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' Cargo.toml | head -n1)"
          if [ -z "$version" ]; then
            echo "no version found in Cargo.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Install reprepro
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends reprepro gnupg
      - name: Import the signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$APT_GPG_PRIVATE_KEY" ]; then
            echo "Secret APT_GPG_PRIVATE_KEY is not set." >&2
            exit 1
          fi
          echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          fingerprint="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')"
          if [ -z "$fingerprint" ]; then
            echo "No signing key imported." >&2
            exit 1
          fi
          echo "APT_KEY_ID=$fingerprint" >> "$GITHUB_ENV"
      - name: Build the APT repository
        run: |
          set -euo pipefail
          mkdir -p apt/conf
          cat > apt/conf/distributions <<EOF
          Origin: AlpenDNS
          Label: AlpenDNS
          Suite: stable
          Codename: stable
          Architectures: amd64 arm64
          Components: main
          Description: AlpenDNS APT repository
          SignWith: $APT_KEY_ID
          EOF
          printf 'verbose\n' > apt/conf/options
          reprepro -b apt remove stable alpendns || true
          reprepro -b apt includedeb stable dist/*.deb
          gpg --export "$APT_KEY_ID" > apt/alpendns.gpg
      - name: Publish to gh-pages
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git worktree add pages origin/gh-pages -B gh-pages
          else
            git worktree add --detach pages
            git -C pages checkout --orphan gh-pages
            git -C pages rm -rf .
          fi
          rm -rf pages/apt
          mkdir -p pages/apt
          cp -a apt/dists apt/pool pages/apt/
          cp apt/alpendns.gpg pages/apt/
          git -C pages config user.name "github-actions[bot]"
          git -C pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C pages add -A
          if git -C pages diff --cached --quiet; then
            echo "gh-pages is already up to date."
            exit 0
          fi
          git -C pages commit -m "chore: publish the APT repository for ${{ steps.v.outputs.tag }}"
          for attempt in 1 2 3; do
            if git -C pages push origin gh-pages; then
              exit 0
            fi
            git -C pages pull --rebase origin gh-pages || true
            sleep 5
          done
          exit 1
