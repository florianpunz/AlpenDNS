name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Die Advisory-Datenbank ändert sich ohne Commit. Ohne diesen Trigger fällt
  # eine neue RUSTSEC-Meldung erst beim nächsten Commit auf, und in einem
  # Repo, das abends und unregelmäßig bearbeitet wird, kann das Wochen dauern.
  # Nicht zur vollen Stunde: dort starten die Workflows der halben Welt, GitHub
  # empfiehlt selbst einen Versatz.
  schedule:
    - cron: '17 6 * * 1'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features
      - name: Test
        run: cargo test --all-features

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t alpendns:ci .
      - name: Check the shipped configuration
        run: docker run --rm alpendns:ci -c /etc/alpendns/alpendns.toml check
      - name: Run the container
        run: |
          set -euo pipefail
          docker run -d --name alpendns-ci \
            -p 15353:53/udp -p 15353:53/tcp \
            -p 18053:8053 -p 19153:9153 \
            -v alpendns-ci-lib:/var/lib/alpendns \
            -v alpendns-ci-cache:/var/cache/alpendns \
            -v "$PWD/packaging/container/smoke:/etc/alpendns:ro" \
            alpendns:ci
      - name: Smoke test
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if dig +time=1 +tries=1 @127.0.0.1 -p 15353 example.com >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          answer="$(dig +short @127.0.0.1 -p 15353 example.com A || true)"
          if [ -z "$answer" ]; then
            docker logs alpendns-ci
            exit 1
          fi
          test "$answer" = "192.0.2.1"
          status="$(dig +noall +comments @127.0.0.1 -p 15353 blocked.smoke | sed -n 's/.*status: \([A-Z]*\).*/\1/p')"
          test "$status" = "NXDOMAIN"
          for _ in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:18053/api/status; then
              break
            fi
            sleep 1
          done
          token="$(docker cp alpendns-ci:/var/lib/alpendns/api.token - | tar -xO)"
          test -n "$token"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" http://127.0.0.1:18053/api/status)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18053/api/status)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:19153/metrics)" = "200"
          test "$(docker inspect --format '{{.Config.User}}' alpendns-ci)" = "65532:65532"
          pid="$(docker inspect --format '{{.State.Pid}}' alpendns-ci)"
          test "$(ps -o uid= -p "$pid" | tr -d ' ')" = "65532"
      - name: Stop the container
        if: always()
        run: |
          docker rm -f alpendns-ci || true
          docker volume rm alpendns-ci-lib alpendns-ci-cache || true

  deny:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      # Der Lauf darf scheitern, ohne dass dieser Job hier endet: der
      # Meldeschritt darunter muss noch drankommen. Ob der Job rot wird,
      # entscheidet der letzte Schritt.
      - id: deny
        uses: EmbarkStudios/cargo-deny-action@v2
        continue-on-error: true
      # Genau ein Issue, das beim nächsten Mal kommentiert statt neu angelegt
      # wird. Ein wöchentlich neues Issue wäre nach drei Monaten Rauschen, und
      # Rauschen wird ignoriert.
      #
      # Nur auf main, nicht auf Pull Requests: aus einem Fork heraus darf
      # GITHUB_TOKEN keine Issues schreiben, und ein roter PR ist ohnehin
      # Sache des Autors.
      - name: Report the advisory
        if: steps.deny.outcome == 'failure' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="cargo deny fails — new advisory?"
          body=$(cat <<TEXT
          The run of "cargo deny check" failed: $RUN_URL

          Nothing in this repo has to have changed for that to happen — the
          advisory database moves without a commit. The procedure is in
          CONTRIBUTING.md under "Dependencies and advisories": first check
          whether the vulnerable path is reachable from here, then fix it or
          enter an exception in deny.toml, with a reason and a condition under
          which it can be removed.
          TEXT
          )
          number=$(gh issue list --state open --limit 200 --json number,title \
            --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          if [ -n "$number" ]; then
            echo "existing issue #$number updated"
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
      - name: Result
        if: steps.deny.outcome == 'failure'
        run: exit 1

  # Jedes Target 120 s (docs/TESTING.md §3). `-O` bildet die Auslieferungs-
  # konfiguration ab (ADR-0006, Bedingung 1); der bekannte TSIG-Fall aus
  # hickory-proto 0.26.1 ist mit 0.26.3 entfallen.
  #
  # `+nightly` gehört an jeden Aufruf: `rust-toolchain.toml` pinnt `stable`, und
  # diese Datei sticht die von `dtolnay/rust-toolchain` installierte nightly aus.
  # Ohne das Flag baut cargo-fuzz mit `-Zsanitizer=address` und bricht ab
  # ("the option `Z` is only accepted on the nightly compiler").
  fuzz:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/alpendns
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - run: cargo +nightly fuzz run -O parse_request -- -max_total_time=120
      - run: cargo +nightly fuzz run -O parse_blocklist -- -max_total_time=120
      - run: cargo +nightly fuzz run -O parse_config -- -max_total_time=120
      - run: cargo +nightly fuzz run -O parse_upstream_addr -- -max_total_time=120
