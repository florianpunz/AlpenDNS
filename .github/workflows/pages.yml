name: Demo

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build the demo
        run: sh web/demo/build.sh
      - name: Publish to gh-pages
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git worktree add pages origin/gh-pages -B gh-pages
          else
            git worktree add --detach pages
            git -C pages checkout --orphan gh-pages
            git -C pages rm -rf .
          fi
          cp web/dist/alpendns-demo.html pages/index.html
          git -C pages config user.name "github-actions[bot]"
          git -C pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C pages add index.html
          if git -C pages diff --cached --quiet; then
            echo "index.html is already up to date."
            exit 0
          fi
          git -C pages commit -m "docs: publish the demo"
          for attempt in 1 2 3; do
            if git -C pages push origin gh-pages; then
              exit 0
            fi
            git -C pages pull --rebase origin gh-pages || true
            sleep 5
          done
          exit 1
