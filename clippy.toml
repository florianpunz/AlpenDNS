# Warum diese Datei: B.1 verbietet unwrap()/expect()/panic!() und Slice-Indexing im
# Produktionscode und erlaubt sie ausdrücklich in #[cfg(test)]-Code. Die Workspace-Lints
# in Cargo.toml unterscheiden das nicht — sie gelten auch für Testcode. Ohne diese Datei
# scheitert `cargo clippy --all-targets -- -D warnings` (die Definition of Done) am
# ersten Test, der ein unwrap() oder ein buf[0] benutzt.

allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
