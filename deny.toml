# cargo-deny: Lizenz- und Advisory-Prüfung. Läuft in CI (Job `deny`) und lokal
# über `cargo deny check`. Siehe CLAUDE.md B.2.

[graph]
# Das Projekt zielt auf Linux. Andere Targets zu prüfen erzeugt nur Rauschen.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
all-features = true

[advisories]
# Kein Dependency mit offenem RUSTSEC-Advisory. Ausnahmen kommen hier rein,
# jeweils mit einer Begründung und der Bedingung, wann sie wegfällt.
# Die Prüfung läuft seit dem wöchentlichen Lauf in ci.yml auch ohne Commit; was
# dann zu tun ist, steht in CONTRIBUTING.md unter "Dependencies and advisories".
ignore = [
    { id = "RUSTSEC-2026-0542", reason = """
humantime 2.4.0: als unmaintained markiert. Das Advisory begründet das damit,
dass chrono unmaintained ist und humantime daran hängt; alle Versionen seien
betroffen, ein sicheres Upgrade gibt es nicht.

**Keine verwundbare Stelle, nur ein Wartungsstand.** Das Advisory nennt keine
Fehlfunktion. Die Prüfung fällt trotzdem darüber, weil `unmaintained` in dieser
Konfiguration ein Fehler ist.

**Der Pfad ist lokal, nicht vom Netz.** humantime kommt ausschließlich über
humantime-serde herein und parst Zeitangaben wie `3s` und `24h` aus
/etc/alpendns/alpendns.toml — zehn Felder in `crates/alpendns/src/config.rs`
tragen `#[serde(with = "humantime_serde")]`. Die Datei ist root-eigen und wird
beim Start einmal gelesen; kein Byte aus einer DNS-Antwort oder einem
Blocklisten-Download erreicht den Parser. chrono steht nicht im Baum
(`cargo tree -i chrono` findet nichts), und humantime 2.4.0 selbst hat keine
Abhängigkeiten.

**Umkehrbedingung:** die Ausnahme fällt weg, sobald humantime oder
humantime-serde eine gepflegte Fassung ohne dieses Advisory bekommt oder ein
gepflegter Ersatz für das Parsen der Zeitangaben einzieht. Sie wird beim
nächsten wöchentlichen Lauf erneut gelesen (CONTRIBUTING.md, "Dependencies and
advisories").
""" },
]
yanked = "deny"

[licenses]
# Der Workspace steht auf AGPL-3.0-or-later. Erlaubt ist deshalb, was damit
# kompatibel ist: die üblichen permissiven Lizenzen des Rust-Ökosystems.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
    # unicode-ident (über proc-macro2/syn in praktisch jedem Baum) verlangt das.
    "Unicode-3.0",
    # GPL-kompatibel laut FSF, wird u. a. von webpki-roots-Nachbarn benutzt.
    "MPL-2.0",
    # Unsere eigenen Crates. Ohne diesen Eintrag meldet cargo-deny den Workspace
    # gegen sich selbst.
    "AGPL-3.0-or-later",
]
confidence-threshold = 0.9
# Einzelne Crates mit sonst nicht erlaubter Lizenz kommen hier rein, nicht in `allow`.
exceptions = [
    # webpki-roots ist keine Software, sondern Mozillas Liste vertrauenswürdiger
    # Wurzelzertifikate. CDLA-Permissive-2.0 ist eine Datenlizenz ohne Copyleft
    # und ohne Auflagen für abgeleitete Werke; sie kollidiert nicht mit AGPL.
    # Als Ausnahme für genau dieses Crate, nicht als generelle Erlaubnis.
    { allow = ["CDLA-Permissive-2.0"], name = "webpki-roots" },
]

[bans]
# Mehrfache Versionen derselben Crate sind im Rust-Ökosystem normal und meist nicht
# lösbar — sichtbar machen ja, Build brechen nein.
multiple-versions = "warn"
# Wildcard-Versionen ("*") machen Builds unreproduzierbar.
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
