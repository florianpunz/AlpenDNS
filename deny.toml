# cargo-deny: Lizenz- und Advisory-Prüfung. Läuft in CI (Job `deny`) und lokal
# über `cargo deny check`. Siehe CLAUDE.md B.2.

[graph]
# Das Projekt zielt auf Linux. Andere Targets zu prüfen erzeugt nur Rauschen.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
all-features = true

[advisories]
# Kein Dependency mit offenem RUSTSEC-Advisory. Ausnahmen kommen hier rein,
# jeweils mit einer Begründung und der Bedingung, wann sie wegfällt.
ignore = [
    { id = "RUSTSEC-2026-0009", reason = """
time 0.3.45: Stack Exhaustion beim Parsen von RFC-2822-Daten aus fremder Eingabe.

Nicht im ausgelieferten Binary: `cargo tree -e normal -i time` findet nichts.
time kommt ausschließlich über rcgen herein, und rcgen ist eine
dev-dependency für die Testzertifikate der DoT/DoH/DoQ-Fakes. Der
verwundbare Pfad wird dabei nicht einmal betreten — rcgen benutzt time, um
Gültigkeitsdaten zu *schreiben*, nicht um fremde Zeichenketten zu lesen.

Der Fix steht in time 0.3.47, verlangt aber Rust 1.88. Der Workspace steht
auf rust-version = 1.85, und diese Zahl hat für die Debian-Paketierung in
Phase 9 Bedeutung. Die Ausnahme fällt weg, sobald die MSRV ohnehin steigt.
""" },
]
yanked = "deny"

[licenses]
# Der Workspace steht auf AGPL-3.0-or-later. Erlaubt ist deshalb, was damit
# kompatibel ist: die üblichen permissiven Lizenzen des Rust-Ökosystems.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
    # unicode-ident (über proc-macro2/syn in praktisch jedem Baum) verlangt das.
    "Unicode-3.0",
    # GPL-kompatibel laut FSF, wird u. a. von webpki-roots-Nachbarn benutzt.
    "MPL-2.0",
    # Unsere eigenen Crates. Ohne diesen Eintrag meldet cargo-deny den Workspace
    # gegen sich selbst.
    "AGPL-3.0-or-later",
]
confidence-threshold = 0.9
# Einzelne Crates mit sonst nicht erlaubter Lizenz kommen hier rein, nicht in `allow`.
exceptions = [
    # webpki-roots ist keine Software, sondern Mozillas Liste vertrauenswürdiger
    # Wurzelzertifikate. CDLA-Permissive-2.0 ist eine Datenlizenz ohne Copyleft
    # und ohne Auflagen für abgeleitete Werke; sie kollidiert nicht mit AGPL.
    # Als Ausnahme für genau dieses Crate, nicht als generelle Erlaubnis.
    { allow = ["CDLA-Permissive-2.0"], name = "webpki-roots" },
]

[bans]
# Mehrfache Versionen derselben Crate sind im Rust-Ökosystem normal und meist nicht
# lösbar — sichtbar machen ja, Build brechen nein.
multiple-versions = "warn"
# Wildcard-Versionen ("*") machen Builds unreproduzierbar.
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
